name: Deploy static content to Pages

on:
  push:
    branches: [main]   # 若你的仓库默认分支是 master，请改成 master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 站点在仓库根目录。若你把关卡内容放在子文件夹 exam-prep-tool/ 下，
          # 把下面这行改成：path: './exam-prep-tool'
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
