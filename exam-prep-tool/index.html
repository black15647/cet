<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>备考助手 · CET-4/6 · 考研英语</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">备考助手</div>
    <div class="topbar-right">
      <span class="muted" id="exam-label"></span>
      <button class="rm-btn" id="theme-toggle" title="切换日间/夜间 (D)" style="border:1px solid var(--line);border-radius:980px;">夜间</button>
    </div>
  </header>

  <div class="layout">
    <nav class="nav">
      <a href="#home" data-view="home">首页</a>
      <a href="#reading" data-view="reading">阅读</a>
      <a href="#trans" data-view="trans">翻译</a>
      <a href="#writing" data-view="writing">写作</a>
      <a href="#listening" data-view="listening">听力</a>
      <a href="#vocab" data-view="vocab">词汇生词本 <span class="badge" id="nav-due" style="display:none"></span></a>
      <a href="#wrong" data-view="wrong">错题本</a>
      <a href="#stats" data-view="stats">统计周报</a>
      <a href="#settings" data-view="settings">设置</a>
    </nav>
    <main id="app">
      <p class="muted">加载中……若长时间无响应，请检查 js/app.js 是否加载成功。</p>
    </main>

    <div class="rm-bar" id="rm-bar">
      <button class="rm-btn" onclick="rmAdjust(-1)" title="缩小字号 (-)">A−</button>
      <button class="rm-btn" onclick="rmAdjust(1)" title="放大字号 (+)">A+</button>
      <span class="rm-sep"></span>
      <button class="rm-btn" onclick="rmLineHeight()" title="切换行间距 (L)">行距</button>
      <button class="rm-btn" onclick="rmToggleTheme()" title="日间/夜间 (D)">夜间</button>
      <span class="rm-sep"></span>
      <button class="rm-btn" onclick="exitReadingMode()" title="退出纯阅读 (Esc)">退出</button>
    </div>
    <button class="rm-float" id="rm-float" onclick="enterReadingMode()">进入纯阅读</button>
  </div>

  <script src="js/data.js"></script>
  <script src="js/realexam.js"></script>
  <script src="js/bank2.js"></script>
  <script src="js/app.js"></script>
  <script>
    setInterval(() => {
      const el = document.getElementById('exam-label');
      if (el && typeof S !== 'undefined') {
        el.textContent = '当前考试：' + ({ cet4: 'CET-4', cet6: 'CET-6', ky1: '考研英一', ky2: '考研英二' })[S.exam];
      }
    }, 500);
  </script>
</body>
</html>
